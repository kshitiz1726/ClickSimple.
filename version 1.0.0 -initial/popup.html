<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClickSimple</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="brand"><span class="mark">C</span><div><h1>ClickSimple</h1><p>Complex interfaces. Simple instructions.</p></div></div>
    <div class="intro">
      <h2>Let's make this page easier.</h2>
      <p>Open the assistant on the website you're currently viewing.</p>
    </div>
    <button id="start">Open assistant <span>→</span></button>
    <p id="status" role="status"></p>
    <div class="foot">Your page stays in your browser. No account needed.</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
